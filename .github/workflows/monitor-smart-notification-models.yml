# Checks the live models against what actually happened, every day.
# A model that is worse than the plain average is switched off (the cards fall back to statistics) and an issue is opened.
# Uses the DIRECT_URL secret of the production environment, which is the Supabase session-pooler URL (IPv4).
name: Monitor smart notification models

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - run: pip install -r ml/requirements.txt

      - name: Check the models
        id: check
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set +e
          python ml/monitor.py --db-url "$DIRECT_URL" --auto-disable --report-file report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Open an issue when a model was switched off
        if: steps.check.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "A smart notification model was switched off" --body-file report.md

      - name: Fail on unexpected errors
        if: steps.check.outputs.code != '0' && steps.check.outputs.code != '2'
        run: exit 1
