# Retrains the smart notification models monthly and opens a pull request into dev with the new model.json.
# The run is also recorded as a "candidate" in the ModelRun table. Nothing goes live until it is promoted:
#   python ml/promote.py --db-url "$DIRECT_URL" --latest --write-file
# Uses the DIRECT_URL secret of the production environment, which is the Supabase session-pooler URL (IPv4).
# Pull requests opened with the default GITHUB_TOKEN do not start other workflows. Close and reopen the pull request to run CI,
# or switch to a personal access token or a GitHub App token.
# The repository setting "Allow GitHub Actions to create and approve pull requests" must be on.
name: Retrain smart notification models

on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  retrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - run: pip install -r ml/requirements.txt

      - name: Run the tests
        run: python -m pytest -q ml/tests

      - name: Train and register a candidate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python ml/train.py --db-url "$DIRECT_URL" --register | tee train-output.txt

      - name: Open a pull request with the new model file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- server/src/services/smart-notifications/model/model.json; then
            echo "model.json did not change."
            exit 0
          fi
          branch="retrain-models-$(date +%Y-%m-%d)"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add server/src/services/smart-notifications/model/model.json
          git commit -m "Retrain smart notification models"
          git push origin "$branch"
          {
            echo "Scheduled retraining. Scores on trips the models had not seen:"
            echo
            echo '```'
            cat train-output.txt
            echo '```'
            echo
            echo "The run is registered as a candidate. To make it live, run:"
            echo
            echo '    python ml/promote.py --db-url "$DIRECT_URL" --latest --write-file'
          } > pr-body.md
          gh pr create --base dev --title "Retrain smart notification models" --body-file pr-body.md
